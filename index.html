<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blue Shield | Water Intelligence</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside id="side">
      <div class="brand"><b>BS</b><strong>BLUE SHIELD<small>Water intelligence</small></strong></div>
      <div class="demo" id="modeLabel">Demo mode</div>
      <nav>
        <button data-v="dashboard" class="active">Dashboard</button>
        <button data-v="quality">Water Quality</button>
        <button data-v="colorimetry">Colorimetry</button>
        <button data-v="location">Filter Location</button>
        <button data-v="alerts">Alerts <em>3</em></button>
        <button data-v="guide">Safety Guide</button>
        <button data-v="settings">Settings</button>
        <button data-v="about">About System</button>
      </nav>
      <footer><b>AC</b><span>Anuraj Chavan<small>Jharkhand pilot site</small></span></footer>
    </aside>
    <main>
      <header>
        <button id="menu">Menu</button>
        <span>Operations / <b id="title">Dashboard</b></span>
        <div class="head-right">
          <div class="mode-switch"><button id="demoMode" class="mode active">Demo</button><button id="liveMode" class="mode">Live</button></div>
          <button id="theme" class="theme-btn" title="Toggle light and dark mode">Dark</button>
          <i class="online"></i><span id="connection">ESP32 connected<small id="updated">Updated just now</small></span>
          <button id="offline" title="Toggle offline mode">Offline</button><b class="avatar">AC</b>
        </div>
      </header>
      <div id="app"><div class="content"><div class="head"><div><div class="eyebrow">Operations overview</div><h1>Good morning, Anuraj Chavan</h1><div class="muted">Loading Blue Shield dashboard...</div></div></div></div></div>
    </main>
  </div>
  <div id="toast"></div>
  <script>delete window.alert;</script>
  <script src="app.js"></script>
</body>
</html>
